<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#08203f">
<title>Events</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" id="side">
  <a class="brand" aria-hidden="true"><img class="lg lg-color" src="logo.png" alt=""><img class="lg lg-light" src="logo-light.png" alt=""></a>
  <nav id="sidenav"></nav>
</aside>
<main>
<header class="top">
  <span class="mlogo"><img src="logo-mark.png" alt=""></span>
  <h1 id="title"></h1>
  <div class="topr"><button id="syncBtn" class="syncchip" type="button"></button></div>
</header>
<div class="updbar" id="updbar" hidden></div>
<div class="content">
  <div class="toolbar" id="toolbar" hidden>
    <div class="tf"><input id="q" type="search" autocomplete="off"><select id="fPeriod" aria-label="period"></select><select id="fStatus" aria-label="status"></select></div>
  </div>
  <div id="main"></div>
</div>
</main>
</div>
<button id="fab" class="fab" type="button">
  <svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><b class="fl"></b>
</button>
<div id="sheet" class="sheetwrap" hidden></div>
<script src="config.js"></script>
<script src="version.js"></script>
<script src="sync.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
