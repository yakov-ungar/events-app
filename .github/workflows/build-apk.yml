name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Stamp the build number into the app
        run: |
          echo "window.APP_VERSION = { code: ${{ github.run_number }}, repo: '${{ github.repository }}' };" > www/version.js
      - run: bash scripts/customize-android.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: events-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish the APK as a release (the app checks this to offer updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk events-app.apk
          gh release create "v${{ github.run_number }}" events-app.apk --title "Version ${{ github.run_number }}" --notes "Automatic build ${{ github.run_number }}" --latest
